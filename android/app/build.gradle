plugins {
    id "com.android.application"
    id "kotlin-android"
    // Firebase — google-services plugin (must be last)
    id "com.google.gms.google-services"
    // Firebase Crashlytics
    id "com.google.firebase.crashlytics"
    // Flutter Gradle Plugin (must be applied after Android and Kotlin plugins)
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.healthfitheal.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.healthfitheal.app"
        // Minimum SDK 26 → Android 8.0
        // • Health Connect requires API 26+
        // • flutter_local_notifications exact alarms require API 26+
        // • Covers ~97% of active Android devices
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Multidex support for large apps (Firebase suite)
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "ENVIRONMENT", '"development"'
            buildConfigField "String", "BASE_URL", '"https://api-dev.healthfitheal.com"'
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "ENVIRONMENT", '"staging"'
            buildConfigField "String", "BASE_URL", '"https://api-staging.healthfitheal.com"'
        }
        production {
            dimension "environment"
            buildConfigField "String", "ENVIRONMENT", '"production"'
            buildConfigField "String", "BASE_URL", '"https://api.healthfitheal.com"'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.multidex:multidex:2.0.1"

    // Java 8+ API desugaring (required for coreLibraryDesugaringEnabled)
    coreLibraryDesugaring "com.android.tools.desugar_jdk_libs:2.0.4"

    // Firebase — use BOM to keep all versions in sync
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-messaging"

    // Health Connect
    implementation "androidx.health.connect:connect-client:1.1.0-rc01"
}
