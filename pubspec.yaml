name: healthfit_heal
description: "HealthFit Heal – A production-ready Android fitness & health application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Local Storage ─────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.8.1

  # ── Logging ───────────────────────────────────────────────────────────────
  logger: ^2.5.0

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.70.2

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.1.3

  # ── SVG ───────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Data Classes ──────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  equatable: ^2.0.7
  intl: ^0.19.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.3
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # ── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # fonts:
