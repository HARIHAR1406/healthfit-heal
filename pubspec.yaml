name: healthfit_heal
description: "HealthFit Heal – A production-ready Android fitness & health application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0

  # ── Local Storage ─────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Firebase Core (already present) ───────────────────────────────────────
  firebase_core: ^3.8.1

  # ── Firebase Authentication ────────────────────────────────────────────────
  firebase_auth: ^5.3.1

  # ── Cloud Firestore ────────────────────────────────────────────────────────
  cloud_firestore: ^5.4.4

  # ── Firebase Storage ───────────────────────────────────────────────────────
  firebase_storage: ^12.3.4

  # ── Firebase Cloud Messaging ───────────────────────────────────────────────
  firebase_messaging: ^15.1.4

  # ── Firebase Analytics ─────────────────────────────────────────────────────
  firebase_analytics: ^11.3.4

  # ── Firebase Crashlytics ───────────────────────────────────────────────────
  firebase_crashlytics: ^4.1.4

  # ── Firebase Remote Config ─────────────────────────────────────────────────
  firebase_remote_config: ^5.1.4

  # ── Firebase Performance ───────────────────────────────────────────────────
  firebase_performance: ^0.10.0+8

  # ── Google Sign-In ─────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Android Health Connect ──────────────────────────────────────────────────
  health: ^12.2.0

  # ── Local Notifications ─────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── File Handling ──────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^7.1.0
  mime: ^2.0.0

  # ── Logging ───────────────────────────────────────────────────────────────
  logger: ^2.5.0

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.70.2

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.1.3

  # ── SVG ───────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Data Classes ──────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  equatable: ^2.0.7
  intl: ^0.19.0
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.3
  shared_preferences: ^2.3.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # ── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

